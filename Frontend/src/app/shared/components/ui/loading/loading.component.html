@if (loadingService.isLoading()) {
  <div class="fixed inset-0 z-100 flex items-center justify-center bg-black/30 dark:bg-black/50 backdrop-blur-sm">
    <div class="flex flex-col items-center gap-3">
      <div class="h-12 w-12 rounded-full border-4 border-teal-200 dark:border-teal-800 border-t-teal-600 dark:border-t-teal-400 animate-spin"></div>
      <span class="text-sm font-medium text-white">Cargando...</span>
    </div>
  </div>
}

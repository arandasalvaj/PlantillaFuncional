<div class="flex flex-col items-center justify-center min-h-[70vh] px-4">
  <div
    class="max-w-md w-full text-center transition-all duration-700 transform"
    [class.opacity-0]="!visible()"
    [class.translate-y-8]="!visible()"
    [class.opacity-100]="visible()"
    [class.translate-y-0]="visible()"
  >
    <!-- Icon -->
    <div class="mx-auto mb-6 flex items-center justify-center h-20 w-20 rounded-full bg-teal-50 dark:bg-teal-950">
      <svg lucideIcon [lucideIcon]="'file-question'" class="h-10 w-10 text-teal-500 dark:text-teal-400"></svg>
    </div>

    <!-- Code -->
    <h1 class="text-7xl font-extrabold text-gray-900 dark:text-slate-100 tracking-tight">404</h1>
    <h2 class="mt-3 text-xl font-semibold text-gray-700 dark:text-slate-300">Página no encontrada</h2>
    <p class="mt-2 text-sm text-gray-500 dark:text-slate-400 leading-relaxed">
      La dirección que buscas no existe o fue movida. Verifica la URL o vuelve al inicio.
    </p>

    <!-- Action -->
    <a
      routerLink="/dashboard"
      class="inline-flex items-center gap-2 mt-8 px-6 py-3 rounded-lg bg-teal-600 hover:bg-teal-700 text-white text-sm font-medium shadow-md hover:shadow-lg transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:ring-offset-2 dark:focus:ring-offset-slate-950"
    >
      <svg lucideIcon [lucideIcon]="'home'" class="h-4 w-4"></svg>
      <span>Volver al inicio</span>
    </a>
  </div>
</div>

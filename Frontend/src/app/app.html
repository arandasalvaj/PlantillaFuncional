<!-- Skip-to-content (a11y) -->
<a
  href="#main"
  class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-50 bg-teal-600 text-white px-4 py-2 rounded-lg shadow-lg font-medium"
>Saltar al contenido principal</a>

<!-- Global overlays -->
<hcc-toast-container />
<app-loading />
<hcc-confirm-dialog />
<hcc-env-badge [env]="env" [version]="version" />
<hcc-version-badge />
<hcc-dev-ribbon />

<!-- App shell -->
<div class="min-h-screen flex flex-col bg-gray-50 dark:bg-slate-950 transition-colors duration-200">
  <app-header />

  <main id="main" class="flex-1 w-full mx-auto max-w-screen-2xl px-4 sm:px-6 lg:px-8 py-6 sm:py-8 lg:py-10">
    <router-outlet />
  </main>

  <app-footer />
</div>

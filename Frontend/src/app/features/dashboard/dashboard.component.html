<!-- Page header -->
<section class="mb-8">
  <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 dark:text-slate-100 tracking-tight">
    Bienvenido, {{ userName() }}
  </h1>
  <p class="mt-1 text-sm sm:text-base text-gray-500 dark:text-slate-400">
    Panel principal del sistema urgenciav2
  </p>
</section>

<!-- Stat cards (hcc-stat-card del DS: replica 1:1 el patrón crudo anterior) -->
<section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6 mb-8">
  <hcc-stat-card label="Documentos" value="—" tone="primary">
    <svg stat-icon lucideIcon [lucideIcon]="'file-text'" class="h-5 w-5"></svg>
  </hcc-stat-card>

  <hcc-stat-card label="Cobros" value="—" tone="success">
    <svg stat-icon lucideIcon [lucideIcon]="'trending-up'" class="h-5 w-5"></svg>
  </hcc-stat-card>

  <hcc-stat-card label="Pacientes" value="—" tone="info">
    <svg stat-icon lucideIcon [lucideIcon]="'users'" class="h-5 w-5"></svg>
  </hcc-stat-card>

  <hcc-stat-card label="Actividad" value="—" tone="warning">
    <svg stat-icon lucideIcon [lucideIcon]="'activity'" class="h-5 w-5"></svg>
  </hcc-stat-card>
</section>

<!-- Content area placeholder -->
<section class="grid grid-cols-1 lg:grid-cols-3 gap-4 sm:gap-6">
  <div class="lg:col-span-2 bg-white dark:bg-slate-800 rounded-xl shadow-sm ring-1 ring-gray-950/5 dark:ring-slate-700/50 p-6">
    <h2 class="text-lg font-semibold text-gray-900 dark:text-slate-100 mb-4">Resumen</h2>
    <div class="flex items-center justify-center h-48 rounded-lg border-2 border-dashed border-gray-200 dark:border-slate-700 text-gray-400 dark:text-slate-500 text-sm">
      Contenido próximamente
    </div>
  </div>

  <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm ring-1 ring-gray-950/5 dark:ring-slate-700/50 p-6">
    <h2 class="text-lg font-semibold text-gray-900 dark:text-slate-100 mb-4">Actividad reciente</h2>
    <div class="flex items-center justify-center h-48 rounded-lg border-2 border-dashed border-gray-200 dark:border-slate-700 text-gray-400 dark:text-slate-500 text-sm">
      Sin actividad
    </div>
  </div>
</section>
